name: quotacore

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quotacore
      POSTGRES_PASSWORD: quotacore
      POSTGRES_DB: quotacore_db
    ports:
      # Published on 5433 so it never clashes with a PostgreSQL installed on
      # the host, and so tests and psql can reach it from the host machine.
      - "5433:5432"
    volumes:
      - quotacore-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quotacore -d quotacore_db"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgres://quotacore:quotacore@db:5432/quotacore_db
      # Development default so that `docker compose up --build` works with no
      # setup. Put your own value in .env (see .env.example) for anything else.
      ADMIN_BOOTSTRAP_KEY: ${ADMIN_BOOTSTRAP_KEY:-dev-admin-key-change-me}
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  client:
    build: ./client
    environment:
      QUOTACORE_URL: http://api:3000
      QUOTACORE_ADMIN_KEY: ${ADMIN_BOOTSTRAP_KEY:-dev-admin-key-change-me}
      STATE_FILE: /data/demo-state.json
      PORT: "4000"
    ports:
      - "4000:4000"
    volumes:
      # Remembers the demo account between restarts.
      - client-data:/data
    depends_on:
      api:
        condition: service_healthy

volumes:
  quotacore-db:
  client-data: